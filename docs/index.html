<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Risk Drift Monitor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Continuous Compliance Monitoring and Risk Drift Detection Framework for Proactive Cybersecurity Governance — compliance checks, configuration drift, vulnerability intake and explainable risk drift.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1110'/%3E%3Cpath d='M4 19h5l3-9 4 14 3-8 2 3h7' fill='none' stroke='%23F2A93B' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: masthead band (title + posture dial) over a live drift recorder on graph paper → signal chain → sticky instrument rail → stage sections of readouts + ledger panels.
   Theme: "drift observatory" — dark control room (default) and daylight audit paper, same tokens. */
:root{
 --bg:#0A100F;--bg2:#0F1716;--panel:#121C1B;--panel2:#172322;--line:#22312E;--line2:#304440;
 --ink:#E9F0ED;--mute:#93A7A0;--mute2:#62766F;
 --amber:#F2A93B;--blue:#73A7FF;--paperGrid:rgba(115,167,255,.07);--paperGrid2:rgba(115,167,255,.14);
 --ok:#3CCB7F;--warn:#E9B949;--bad:#F2575A;--unk:#B3A5F2;--err:#EE77BC;--hi:#F28A4B;
 --c1:#73A7FF;--c2:#F2A93B;--c3:#3CCFC0;--c4:#EE77BC;--c5:#B3A5F2;--c6:#A5D86E;--c7:#F28A4B;
 --shadow:0 18px 50px -24px rgba(0,0,0,.7);--glowA:rgba(242,169,59,.22);
 --display:"Archivo","Arial Narrow",system-ui,sans-serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Consolas,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --bg:#EEF1EC;--bg2:#E5EAE4;--panel:#FBFCFA;--panel2:#F2F5F1;--line:#D5DDD5;--line2:#BCC8BE;
 --ink:#13201B;--mute:#55665F;--mute2:#7F9089;
 --amber:#B4690E;--blue:#2453B8;--paperGrid:rgba(36,83,184,.07);--paperGrid2:rgba(36,83,184,.15);
 --ok:#13834C;--warn:#A06A00;--bad:#C42B2E;--unk:#6556B8;--err:#A8346F;--hi:#C2560F;
 --c1:#2453B8;--c2:#B4690E;--c3:#0E7C70;--c4:#A8346F;--c5:#6556B8;--c6:#4E7F16;--c7:#C2560F;
 --shadow:0 14px 34px -22px rgba(20,40,30,.35);--glowA:rgba(180,105,14,.16);color-scheme:light}}
:root[data-theme="light"]{
 --bg:#EEF1EC;--bg2:#E5EAE4;--panel:#FBFCFA;--panel2:#F2F5F1;--line:#D5DDD5;--line2:#BCC8BE;
 --ink:#13201B;--mute:#55665F;--mute2:#7F9089;
 --amber:#B4690E;--blue:#2453B8;--paperGrid:rgba(36,83,184,.07);--paperGrid2:rgba(36,83,184,.15);
 --ok:#13834C;--warn:#A06A00;--bad:#C42B2E;--unk:#6556B8;--err:#A8346F;--hi:#C2560F;
 --c1:#2453B8;--c2:#B4690E;--c3:#0E7C70;--c4:#A8346F;--c5:#6556B8;--c6:#4E7F16;--c7:#C2560F;
 --shadow:0 14px 34px -22px rgba(20,40,30,.35);--glowA:rgba(180,105,14,.16);color-scheme:light}
:root[data-theme="dark"]{
 --bg:#0A100F;--bg2:#0F1716;--panel:#121C1B;--panel2:#172322;--line:#22312E;--line2:#304440;
 --ink:#E9F0ED;--mute:#93A7A0;--mute2:#62766F;
 --amber:#F2A93B;--blue:#73A7FF;--paperGrid:rgba(115,167,255,.07);--paperGrid2:rgba(115,167,255,.14);
 --ok:#3CCB7F;--warn:#E9B949;--bad:#F2575A;--unk:#B3A5F2;--err:#EE77BC;--hi:#F28A4B;
 --c1:#73A7FF;--c2:#F2A93B;--c3:#3CCFC0;--c4:#EE77BC;--c5:#B3A5F2;--c6:#A5D86E;--c7:#F28A4B;
 --shadow:0 18px 50px -24px rgba(0,0,0,.7);--glowA:rgba(242,169,59,.22);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg2)}
a{color:var(--blue);text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cap{font:600 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* ---------- masthead */
.mast{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
 background:radial-gradient(900px 340px at 85% -10%,var(--glowA),transparent 70%),
 linear-gradient(var(--paperGrid) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--paperGrid) 1px,transparent 1px) 0 0/16px 16px,
 linear-gradient(var(--paperGrid2) 1px,transparent 1px) 0 0/80px 80px,linear-gradient(90deg,var(--paperGrid2) 1px,transparent 1px) 0 0/80px 80px,var(--bg2)}
.bar{display:flex;align-items:center;gap:14px;padding-block:14px}
.logo{display:flex;align-items:center;gap:11px}
.logo b{font:800 17px/1 var(--display);font-stretch:118%;letter-spacing:.02em}
.logo small{display:block;white-space:nowrap;font:500 10.5px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.bar .sp{flex:1}
.stamp{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sc,var(--mute));
 border:1.5px solid var(--sc,var(--line2));border-radius:3px;padding:5px 7px;white-space:nowrap;background:color-mix(in srgb,var(--sc,transparent) 9%,transparent)}
.stamp.rot{transform:rotate(-2.5deg)}
.led{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--ok));box-shadow:0 0 8px var(--sc,var(--ok));animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.tbtn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:6px 11px;font:500 12px var(--mono);color:var(--ink)}
.tbtn:hover{border-color:var(--amber)}
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:18px 8px}
.hero .cap{color:var(--amber)}
.hero h1{font:800 clamp(28px,3.6vw,46px)/1.04 var(--display);font-stretch:112%;letter-spacing:-.012em;margin:10px 0 14px;text-wrap:balance}
.hero h1 .hl{color:var(--amber)}
.hero h1 .hb{color:var(--blue)}
.by{color:var(--mute);font-size:14px;max-width:70ch}
.by b{color:var(--ink);font-weight:600}
.dial{background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.dial svg+.row{margin-top:6px}.dial .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute);padding:7px 0;border-top:1px dashed var(--line)}
.dial .row b{font:600 12.5px var(--mono);color:var(--ink)}
.rec{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 55%,transparent);overflow:hidden}
.rec .hd{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rec .hd .cap{color:var(--ink)}
.rec .cw svg{display:block;width:100%;height:auto}
.trace{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.4s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sweep{animation:sweep 5.5s linear infinite}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(var(--sw))}}
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding-block:16px 20px}
.mod{position:relative;border:1px solid var(--line);border-radius:10px;padding:11px 12px 11px 14px;background:var(--panel);overflow:hidden}
.mod:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--mc)}
.mod .n{font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--mc)}
.mod b{display:block;font:700 14px/1.2 var(--display);font-stretch:108%;margin:3px 0 2px}
.mod span{font-size:12px;color:var(--mute)}
.mod i{position:absolute;right:11px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--mc);box-shadow:0 0 7px var(--mc)}

/* ---------- rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.rail .in{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none}
.rail .in::-webkit-scrollbar{display:none}
.rail .g{display:flex;align-items:center;gap:2px;padding-right:10px;margin-right:8px;border-right:1px solid var(--line)}
.rail .g:last-child{border:0}
.rail .gl{font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--mute2);text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg);padding:0 6px 0 2px}
.rail a{display:flex;align-items:center;gap:7px;padding:13px 11px 11px;color:var(--mute);font:500 13px var(--sans);white-space:nowrap;border-bottom:2.5px solid transparent}
.rail a svg{flex:none;opacity:.8}
.rail a:hover{color:var(--ink)}
.rail a.on{color:var(--ink);border-bottom-color:var(--amber)}
.rail a.on svg{color:var(--amber);opacity:1}

/* ---------- sections */
main{padding-block:26px 70px}
section{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:18px}
.sh .cap{color:var(--amber)}
.sh h2{font:800 clamp(22px,2.4vw,30px)/1.1 var(--display);font-stretch:110%;margin:6px 0 6px;letter-spacing:-.005em;text-wrap:balance}
.sh p{margin:0;color:var(--mute);max-width:80ch;font-size:14px}
.pick{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px 6px 6px 12px}
.pick select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:500 13px var(--mono);max-width:52vw}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.mt{margin-top:16px}
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.pnl>h3{display:flex;align-items:center;gap:9px;margin:0 0 14px;font:700 13.5px/1.2 var(--display);font-stretch:110%;letter-spacing:.02em;text-transform:uppercase}
.pnl>h3 .cap{margin-left:auto;text-transform:none;letter-spacing:.04em;font-weight:500;font-size:11px}
.pnl>h3 svg{color:var(--amber);flex:none}
.ro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}
.ro>div{position:relative;padding:15px 18px 14px;border-right:1px solid var(--line);min-width:0}
.ro>div:last-child{border-right:0}
.ro .cap{display:flex;align-items:center;gap:7px}
.ro .cap i{width:8px;height:8px;border-radius:2px;background:var(--rc);flex:none}
.ro .v{font:600 30px/1.1 var(--mono);color:var(--rc,var(--ink));margin:8px 0 3px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ro .s{font-size:12px;color:var(--mute)}
.ro .m{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.ro .m i{display:block;height:100%;background:var(--rc);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:560px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:9px 11px;border-bottom:1px solid var(--line2);background:var(--panel2);position:sticky;top:0;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--amber) 5%,transparent)}
.note{font-size:12.5px;color:var(--mute);line-height:1.55}
.callout{display:flex;gap:12px;border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 8%,var(--panel));border-radius:12px;padding:13px 16px;font-size:13px;color:var(--mute);line-height:1.6}
.callout b{color:var(--amber)}
.callout svg{flex:none;color:var(--amber);margin-top:2px}
.empty{padding:34px 18px;text-align:center;color:var(--mute);border:1.5px dashed var(--line2);border-radius:12px;font-size:13.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:3px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{white-space:nowrap;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--mute);border-radius:6px;padding:5px 10px;font:600 11px var(--mono);letter-spacing:.06em}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ring{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 10px 10px;background:var(--panel2);text-align:center;transition:border-color .2s,transform .2s;min-width:0}
.ring:hover{transform:translateY(-2px);border-color:var(--line2)}
.ring.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.ring svg{width:112px;height:112px;display:block;margin:0 auto 6px}
.ring b{display:block;font:600 12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring small{font-size:11px;color:var(--mute)}
.ck{position:relative;border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:var(--panel);min-width:0;box-shadow:var(--shadow)}
.ck .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ck .id{font:600 11px var(--mono);color:var(--mute);letter-spacing:.08em}
.ck h4{margin:3px 0 10px;font:700 15px/1.25 var(--display);font-stretch:105%}
.kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:5px 12px;font-size:13px}
.kv>b{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute2);padding-top:2px}
.kv>span{word-break:break-word;min-width:0}
details{margin-top:10px}summary{cursor:pointer;font:500 12px var(--mono);color:var(--blue)}
pre{margin:8px 0 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);color:var(--mute);overflow:auto;max-height:240px}
.ledger{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
.ledger li{display:grid;grid-template-columns:52px 14px minmax(0,1fr);gap:0 12px;position:relative;padding-bottom:16px}
.ledger .run{font:600 11px/1.3 var(--mono);color:var(--mute);text-align:right;padding-top:3px}
.ledger .run small{display:block;color:var(--mute2);font-weight:400}
.ledger .pin{position:relative}
.ledger .pin:before{content:"";position:absolute;left:6px;top:0;bottom:-16px;width:2px;background:var(--line)}
.ledger li:last-child .pin:before{bottom:0}
.ledger .pin i{position:absolute;left:1px;top:5px;width:12px;height:12px;border-radius:3px;background:var(--pc);box-shadow:0 0 0 3px var(--panel),0 0 10px var(--pc)}
.ledger .t{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:700 13.5px var(--display);font-stretch:106%}
.ledger .x{font-size:13px;color:var(--mute);margin-top:3px}
.ledger .df{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;font:11.5px/1.45 var(--mono);color:var(--mute2);margin-top:6px;word-break:break-all}
.ledger .df b{color:var(--mute);font-weight:500}
.row3{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 52px;gap:12px;align-items:center;margin:9px 0;font-size:13px}
.row3 .lab{font:500 12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row3 .val{font:600 13px var(--mono);text-align:right}
.tile{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);min-width:0}
.tile .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.tile .x{font-weight:600;font-size:13px}.tile .y{font-size:12px;color:var(--mute)}
.tile .z{margin-left:auto;font:600 14px var(--mono);color:var(--tc);white-space:nowrap;padding-left:8px}
.cw{overflow-x:auto}.cw>svg{min-width:var(--mw,0)}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute2)}
#tip{position:fixed;pointer-events:none;z-index:60;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.45;box-shadow:var(--shadow);display:none;max-width:360px;color:var(--mute)}
#tip b{color:var(--ink)}
svg text{font-family:var(--sans)}
@media (max-width:1100px){.hero{grid-template-columns:1fr}.g3,.g32,.g23{grid-template-columns:1fr}.chain{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g2{grid-template-columns:1fr}.ro{grid-template-columns:1fr 1fr}.ro>div:nth-child(2){border-right:0}.ro>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
 .chain{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:18px}.mod{flex:0 0 72%;scroll-snap-align:start}.sh{grid-template-columns:1fr}.bar .hide{display:none}.rail .gl{display:none}.kv{grid-template-columns:1fr}.kv>b{padding-top:6px}.tbtn span{display:none}}
@media (max-width:420px){.ro .v{font-size:24px}.logo small{display:none}.dial .row{font-size:12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.trace{stroke-dashoffset:0}}
</style></head>
<body>
<header class="mast">
 <div class="gut"><div class="wrap">
  <div class="bar">
   <div class="logo"><svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><rect x="1" y="1" width="36" height="36" rx="9" style="fill:var(--panel);stroke:var(--line2)"/>
    <path d="M6 22h6l3-10 5 16 3-9 2 3h7" style="fill:none;stroke:var(--amber);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/></svg>
    <div><b id="bName">RDF</b><small id="bSub">Risk Drift Monitor</small></div></div>
   <div class="sp"></div>
   <span class="stamp hide" id="stk"></span>
   <span class="stamp" id="sOrigin"><span class="led"></span><span></span></span>
   <button class="tbtn" id="theme" type="button" aria-label="Switch dark or light theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg><span id="tlab">Theme</span></button>

function recorder(){

  <text x="${Wd-R+20}" y="${y+3.5}" style="fill:${e[2]};font:600 10.5px var(--mono)">${f1(e[3][2]&&e[3][2].score)} ${esc(e[1].id.replace(/^syn-/,""))}</text>`});

/* ------------------------------------------------ 6 risk drift */
function sRiskDrift(){
 const a=byId[cur];
 let h=head("Risk drift","ΔR = Rₜ − Rₜ₋₁, recorded over time",`Each score is compared only with the previous comparable score (same asset, model version and component set). |ΔR| ≥ ${D.model.sig} is significant. The model is linear, so ΔR splits exactly into component contributions.`,true);
 if(!a||!a.scores.length)return h+empty("No scores for this asset yet.");
 const sc=a.scores,lt=sc[sc.length-1],dd=sc.filter(s=>s.drift&&s.drift.delta!=null);
 h+=ro([[f1(lt.score),"Current R",`${lt.status.toLowerCase()} · ${lt.band||"no band"} · ${esc(lt.crit)}`,BD[lt.band]||"var(--mute)",(lt.score||0)/100],
  [lt.drift&&lt.drift.delta!=null?(lt.drift.delta>0?"+":"")+f2(lt.drift.delta):"–","Latest ΔR",lt.drift?lt.drift.dir.toLowerCase().replace("_"," "):"–",lt.drift?DIR[lt.drift.dir]:"var(--mute)"],
  [String(dd.filter(s=>s.drift.sig).length),"Significant shifts",`${dd.filter(s=>s.drift.delta>0).length} up · ${dd.filter(s=>s.drift.delta<0).length} down`,"var(--amber)"],
  [String(sc.length),"Scores recorded",`model ${esc(lt.model)}`,"var(--c5)"]]);
 h+=`<div class="mt">${pnl(`Risk trace · ${esc(cur)}`,"rd",`<div class="cw" style="--mw:720px">${lineChart(sc,a)}</div>`)}</div>`;
 h+=`<div class="grid g2 mt">${pnl("What moved the latest change","pri",waterfall(lt))}${pnl("Risk drift events","hist",`<div class="tw" style="max-height:360px"><table><thead><tr><th>When</th><th>R</th><th>ΔR</th><th>Direction</th><th>Status</th></tr></thead><tbody>
 ${sc.slice().reverse().map(s=>`<tr><td class="mono">${dt(s.t)}</td><td class="mono">${f1(s.score)}</td><td class="mono" style="color:${s.drift?DIR[s.drift.dir]:"inherit"}">${s.drift&&s.drift.delta!=null?(s.drift.delta>0?"+":"")+f2(s.drift.delta):"–"}</td><td>${s.drift?stamp(s.drift.dir.replace("_"," ")+(s.drift.sig?" ●":""),DIR[s.drift.dir]):"–"}</td><td class="mono">${s.status}</td></tr>`).join("")}</tbody></table></div>`)}</div>`;
 return h;
}
function lineChart(sc,a){
 const Wd=1060,H=310,L=40,R=24,T=16,B=36,n=sc.length,X=i=>n<2?L+(Wd-L-R)/2:L+i*(Wd-L-R)/(n-1),Y=v=>T+(1-v/100)*(H-T-B);
 let s=`<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Risk score history">`;
 const bands=Object.entries(D.model.bands).sort((x,y)=>x[1]-y[1]);
 bands.forEach(([b,lo],i)=>{const hi=i<bands.length-1?bands[i+1][1]:100;s+=`<rect x="${L}" y="${Y(hi)}" width="${Wd-L-R}" height="${Y(lo)-Y(hi)}" style="fill:${BD[b]};opacity:.06"/><text x="${L+8}" y="${Y(hi)+14}" style="fill:${BD[b]};font:600 9.5px var(--mono);letter-spacing:.12em;opacity:.85">${b.toUpperCase()}</text>`});
 [0,25,50,75,100].forEach(v=>s+=`<line x1="${L}" x2="${Wd-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" style="fill:var(--mute2);font:10px var(--mono)">${v}</text>`);
 const pts=sc.map((x,i)=>[i,x]).filter(([,x])=>x.score!=null);
 if(pts.length){const up=pts.map(([i,x])=>`${X(i)},${Y(x.hi??x.score)}`),dn=pts.slice().reverse().map(([i,x])=>`${X(i)},${Y(x.lo??x.score)}`);
  s+=`<polygon points="${up.concat(dn).join(" ")}" style="fill:var(--amber);opacity:.14"/>`;
  const d=pts.map(([i,x],k)=>`${k?"L":"M"}${X(i)} ${Y(x.score)}`).join("");let len=0;for(let k=1;k<pts.length;k++)len+=Math.hypot(X(pts[k][0])-X(pts[k-1][0]),Y(pts[k][1].score)-Y(pts[k-1][1].score));
  s+=`<path class="trace" d="${d}" style="stroke:var(--amber);stroke-width:2.6;--len:${Math.ceil(len)+2}"/>`;
  pts.forEach(([i,x])=>{const dr=x.drift,top=(x.expl||[]).filter(e=>e.kind=="DRIFT"&&!["delta","note","component_contribution"].includes(e.factor)).slice(0,3).map(e=>"• "+esc(e.detail)).join("<br>");
   if(dr&&dr.sig)s+=`<circle cx="${X(i)}" cy="${Y(x.score)}" r="11" style="fill:none;stroke:${DIR[dr.dir]};stroke-width:2"/>`;
   s+=`<circle cx="${X(i)}" cy="${Y(x.score)}" r="6" style="fill:${BD[x.band]||"var(--mute)"};stroke:var(--panel);stroke-width:2.5" data-tip="<b>${dt(x.t)}</b><br>R ${f1(x.score)} · ${x.status} · ${x.band||""}<br>${dr?`${dr.dir}${dr.delta!=null?" "+(dr.delta>0?"+":"")+f2(dr.delta):""}`:""}${top?"<br>"+top:""}"/>`;
   if(dr&&dr.delta!=null&&Math.abs(dr.delta)>=D.model.sig)s+=`<text x="${X(i)}" y="${Y(x.score)-17}" text-anchor="middle" style="fill:${DIR[dr.dir]};font:600 11px var(--mono)">${dr.delta>0?"+":""}${f1(dr.delta)}</text>`});}
 const step=Math.ceil(n/8);sc.forEach((x,i)=>{if(i%step==0||i==n-1)s+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" style="fill:var(--mute2);font:10px var(--mono)">${day(x.t).slice(5)}</text>`});
 (a.crit_hist||[]).slice(1).forEach(([t,c])=>{const i=sc.findIndex(x=>x.t>=t);if(i>=0)s+=`<line x1="${X(i)-7}" x2="${X(i)-7}" y1="${T}" y2="${H-B}" style="stroke:var(--c4);stroke-dasharray:3 4"/><text x="${X(i)-11}" y="${T+11}" text-anchor="end" style="fill:var(--c4);font:600 10px var(--mono)">criticality → ${esc(c)}</text>`});
 return s+`</svg><div class="legend"><span><i style="background:var(--amber)"></i>risk score</span><span><i style="background:var(--amber);opacity:.3"></i>uncertainty bounds</span><span><i style="border:2px solid var(--bad);background:none;border-radius:50%"></i>significant ΔR</span><span><i style="background:var(--c4)"></i>criticality change</span></div>`;

function waterfall(s){

 ks.forEach(k=>{const v=cd[k];h+=`<div class="tile" style="--tc:${CC[k]}"><div class="ic"><b class="mono">${k}</b></div><div style="flex:1;min-width:0"><div class="x">${CN[k]}</div>
  <div style="height:8px;position:relative;background:var(--line);border-radius:4px;margin-top:6px"><i style="position:absolute;top:0;bottom:0;border-radius:4px;background:${v>0?"var(--bad)":"var(--ok)"};${v>=0?"left:50%":"right:50%"};width:${Math.abs(v||0)/mx*50}%"></i><i style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mute2)"></i></div></div>
  <div class="z" style="color:${v>0?"var(--bad)":v<0?"var(--ok)":"var(--mute)"}">${v==null?"–":(v>0?"+":"")+f2(v)}</div></div>`});

 const a=byId[cur];
 let h=head("Explainability","Why the score is what it is, and why it moved","Every factor points to a stored record: a check result, drift event, finding or criticality change. Evidence seen between two scores is listed as coinciding with the change, never as its proven cause.",true);

  criticality_change:"var(--c4)",stale_evidence:"var(--warn)",component_contribution:"var(--c3)",delta:"var(--amber)",baseline:"var(--blue)",note:"var(--mute2)",not_comparable:"var(--warn)",
  no_evidence_found:"var(--mute2)",scan_imported:"var(--c1)",vulnerability:"var(--c1)",compliance:"var(--c3)",drift:"var(--c2)",component:"var(--mute)",data_quality:"var(--warn)"};

/* ------------------------------------------------ 9 baselines */
function sBaseline(){
 let h=head("Baseline comparison","CVSS-only vs compliance-only vs proposed","The same stored data ranked three ways. CVSS-only ignores configuration and context; compliance-only ignores vulnerabilities; the proposed score combines both with drift and asset criticality. Rank 1 is the highest priority.");
 const E=D.evaluation&&D.evaluation.baseline,rows=(E?E.table:D.prio)||[];
 if(rows.length<2)return h+empty("At least two assets with data are needed for a ranking comparison.");
 const tau=E?E.tau:{proposed_vs_cvss_only:D.tau.cvss,proposed_vs_compliance_only:D.tau.comp};
 h+=ro([[f2(tau.proposed_vs_cvss_only),"Kendall τ vs CVSS-only","1 identical order · 0 unrelated","var(--c1)",Math.max(0,tau.proposed_vs_cvss_only)],
  [f2(tau.proposed_vs_compliance_only),"Kendall τ vs compliance-only","1 identical order · 0 unrelated","var(--c3)",Math.max(0,tau.proposed_vs_compliance_only)],
  [String(rows.length),"Assets ranked",E?"synthetic evaluation portfolio":"assets in this database","var(--amber)"],
  [E&&E.top2?f2(E.top2.proposed_vs_cvss_only):"–","Top-2 overlap vs CVSS-only","share of the same top-2 assets","var(--c5)"]]);
 h+=`<div class="grid g32 mt">${pnl("How each method orders the assets","cmpb",`<div class="cw" style="--mw:520px">${bump(rows)}</div>`)}${pnl("Weight sensitivity","pri",E&&E.sens_tau?Object.entries(E.sens_tau).map(([k,v])=>`<div class="row3" style="grid-template-columns:140px minmax(0,1fr) 44px"><span style="font-size:13px">${esc(k.replace(/_/g," "))}</span>${meter(Math.max(0,v),"var(--c5)")}<span class="val">${f2(v)}</span></div>`).join("")+`<p class="note">τ between the ranking under each alternative weight set and the default ranking. Higher means the order is robust to reasonable weight changes.</p>`:empty("Run python cli.py evaluate-baselines."))}</div>`;
 h+=`<div class="mt">${pnl("Ranking table","db",`<div class="tw"><table><thead><tr><th>Asset</th><th>Criticality</th><th>Max CVSS</th><th>High</th><th>Failing</th><th>R</th><th>CVSS-only</th><th>Compliance-only</th><th>Proposed</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td class="mono" style="font-weight:600">${esc(r.asset_id)}</td><td>${stamp(r.criticality,BD[r.criticality]||"var(--mute)")}</td><td class="mono">${r.max_cvss??"–"}</td><td class="mono">${r.high_findings}</td><td class="mono">${r.non_compliant??"–"}</td><td class="mono">${f1(r.risk_score)}</td><td class="mono">#${r.rank_cvss_only}</td><td class="mono">#${r.rank_compliance_only}</td><td class="mono" style="color:var(--amber);font-weight:600">#${r.rank_proposed}</td></tr>`).join("")}</tbody></table></div>
 <p class="note">These statistics show how the methods differ on the stored data. They do not show which ordering is correct; that needs an independent ground truth such as expert rankings (docs/EVALUATION.md).</p>`)}</div>`;

}
function bump(rows){
 const cols=[["rank_cvss_only","CVSS-only"],["rank_compliance_only","Compliance-only"],["rank_proposed","Proposed"]];

 const pos={};cols.forEach(([k])=>{const g={};rows.forEach((r,i)=>{(g[r[k]]=g[r[k]]||[]).push(i)});Object.entries(g).forEach(([rk,ids])=>ids.forEach((i,j)=>{pos[k+i]=36+(rk-1)/Math.max(1,mxr-1)*(H-82)+(j-(ids.length-1)/2)*14}))});
 let s=`<svg viewBox="0 0 ${Wd} ${H}" width="100%">`;
 cols.forEach(([k,t],ci)=>s+=`<line x1="${X(ci)}" x2="${X(ci)}" y1="24" y2="${H-28}" style="stroke:var(--line2)"/><text x="${X(ci)}" y="14" text-anchor="middle" style="fill:${ci==2?"var(--amber)":"var(--mute)"};font:600 10.5px var(--mono);letter-spacing:.1em">${t.toUpperCase()}</text>`);
 for(let k=1;k<=mxr;k++){const y=36+(k-1)/Math.max(1,mxr-1)*(H-82);s+=`<text x="${L-14}" y="${y+4}" text-anchor="end" style="fill:var(--mute2);font:10.5px var(--mono)">#${k}</text>`}
 rows.forEach((r,i)=>{const c=PAL[i%PAL.length],pts=cols.map(([k],ci)=>[X(ci),pos[k+i]]);
  s+=`<g data-tip="<b>${esc(r.asset_id)}</b><br>CVSS-only #${r.rank_cvss_only} · compliance-only #${r.rank_compliance_only} · proposed #${r.rank_proposed}"><path d="M${pts[0].join(" ")}C${pts[0][0]+60} ${pts[0][1]} ${pts[1][0]-60} ${pts[1][1]} ${pts[1].join(" ")}S${pts[2][0]-60} ${pts[2][1]} ${pts[2].join(" ")}" style="fill:none;stroke:${c};stroke-width:2.6;opacity:.9"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5.5" style="fill:${c};stroke:var(--panel);stroke-width:2"/>`).join("")}
  <text x="${X(2)+12}" y="${pts[2][1]+4}" style="fill:${c};font:600 11.5px var(--mono)">${esc(r.asset_id)}</text></g>`});
 return s+`</svg>`;
}

/* ------------------------------------------------ 10 data quality */
function sQuality(){
 let h=head("Data quality","Assessment history, gaps and stale data","Failed runs are never used as a drift reference. Undetermined checks and stale scans widen the score bounds and are listed here instead of being hidden.");
 const runs=A.flatMap(a=>a.runs.map(r=>({...r,asset:a.id}))).sort((x,y)=>y.started_at.localeCompare(x.started_at));
 const und=A.flatMap(a=>a.checks.filter(c=>c.status=="UNKNOWN"||c.status=="ERROR").map(c=>({...c,asset:a.id})));
 const warn=[];A.forEach(a=>{const s=a.scans[a.scans.length-1];if(!s)warn.push([a.id,"No vulnerability scan imported, so V is unknown."]);else{const age=(Date.now()-Date.parse(s.scan_ended_at||s.imported_at))/864e5;if(!(age<=D.model.stale_days))warn.push([a.id,`Latest scan is ${isFinite(age)?age.toFixed(0)+" days":"undated"} old (limit ${D.model.stale_days}).`])}
  if(!a.checks.length)warn.push([a.id,"No successful assessment, so C is unknown."])});
 h+=ro([[String(runs.length),"Assessment runs",`${runs.filter(r=>r.status=="COMPLETE").length} complete · ${runs.filter(r=>r.status=="PARTIAL").length} partial`,"var(--c1)"],
  [String(runs.filter(r=>r.status=="FAILED").length),"Failed runs","never used as drift reference","var(--bad)"],
  [String(und.length),"Undetermined checks","unknown or error, latest runs","var(--unk)"],
  [String(warn.length),"Stale or missing data","warnings across assets","var(--warn)"]]);
 h+=`<div class="grid g2 mt">${pnl("Warnings","alert",(warn.length||und.length)?`<div class="grid" style="gap:8px">${warn.map(([a,w])=>`<div class="tile" style="--tc:var(--warn)"><div class="ic">${ic("alert")}</div><div style="min-width:0"><div class="x mono">${esc(a)}</div><div class="y">${esc(w)}</div></div></div>`).join("")}
 ${und.map(c=>`<div class="tile" style="--tc:${ST[c.status]}"><div class="ic">${ic("x")}</div><div style="min-width:0"><div class="x mono">${esc(c.asset)} · ${c.id}</div><div class="y">${esc(c.reason)}</div></div><div class="z" style="font-size:11px">${SL[c.status]}</div></div>`).join("")}</div>`:empty("No data-quality warnings."))}
 ${pnl("Risk model card","db",Object.entries(W).map(([k,v])=>`<div class="row3" style="grid-template-columns:120px minmax(0,1fr) 44px"><span style="color:${CC[k]};font-size:13px;font-weight:600">${CN[k]} (${k})</span>${meter(v,CC[k])}<span class="val">${v.toFixed(2)}</span></div>`).join("")+
 `<p class="note">Bands: ${Object.entries(D.model.bands).map(([b,v])=>`${b} ≥ ${v}`).join(" · ")}<br>Criticality: ${Object.entries(D.model.crit).map(([b,v])=>`${b} ${v}`).join(" · ")}<br>Check weights: ${Object.entries(D.model.check_weights).map(([b,v])=>`${b} ${v}`).join(" · ")}<br>Scan stale after ${D.model.stale_days} days · significant |ΔR| ≥ ${D.model.sig}</p>`,esc(D.model.version))}</div>`;
 h+=`<div class="mt">${pnl("All assessment runs","hist",`<div class="tw"><table><thead><tr><th>Run</th><th>Asset</th><th>Started</th><th>Status</th><th>Policy</th><th>OPA</th><th>Collector</th><th>Origin</th><th>Error</th></tr></thead><tbody>
 ${runs.map(r=>`<tr><td class="mono">#${r.run_id}</td><td class="mono">${esc(r.asset)}</td><td class="mono">${dt(r.started_at)}</td><td>${stamp(r.status,r.status=="COMPLETE"?"var(--ok)":r.status=="PARTIAL"?"var(--warn)":"var(--bad)")}</td><td class="mono">${esc(r.policy_version||"–")}</td><td class="mono">${esc(r.opa_version||"–")}</td><td class="mono">${esc(r.collector_version||"–")}</td><td class="mono">${esc(r.data_origin)}</td><td class="note">${esc(r.error_message||"")}</td></tr>`).join("")}</tbody></table></div>`)}</div>`;
 return h;
}

  const t0=performance.now(),st=t=>{const k=Math.min(1,(t-t0)/800),v=tgt*(1-Math.pow(1-k,3));el.textContent=(v>0?sign:"")+v.toFixed(dec)+m[2];if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
